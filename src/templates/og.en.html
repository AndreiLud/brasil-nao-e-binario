<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brazil is not binary</title>
<link rel="stylesheet" href="css/style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17161c; }
  .og { position: relative; width: 100vw; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; align-items: center; color: #eee8df; }
  .og .text { padding: 0 0 0 7vw; }
  .og .kicker { color: #a9a298; font-size: 1.5vw; letter-spacing: 0.14em; margin-bottom: 2.4vh; }
  .og h1 { font-size: 7.4vw; line-height: 0.92; color: #fbf7f1; }
  .og h1 em { font-style: italic; font-weight: 500; color: #e9c3c4; }
  .og p.fact { font: 400 2.05vw/1.35 var(--serif); color: #d8d1c6; margin-top: 4vh; max-width: 34vw; }
  .og p.fact b { font-family: var(--sans); font-weight: 700; color: #fff; }
  .og .map { position: relative; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .og canvas { width: 46vw; height: auto; }
  .og .keys { position: absolute; bottom: 5vh; right: 5vw; display: flex; gap: 2vw; font: 500 1.25vw var(--sans); color: #a9a298; }
  .og .keys i { display: inline-block; width: 1vw; height: 1vw; border-radius: 50%; margin-right: 0.6vw; vertical-align: -0.1vw; }
</style>
</head>
<body>
<div class="og">
  <div class="text">
    <p class="kicker">Presidential elections 2018 · 2022 · 2026</p>
    <h1>Brazil is not <em>binary</em></h1>
    <p class="fact"><b>{{e2026r2_local_minority_votes}}</b> people voted, in Brazil's 2026 runoff, for the candidate who lost in their own municipality.</p>
  </div>
  <div class="map"><canvas id="c"></canvas>
    <div class="keys"><span><i style="background:#a68be6"></i>Lula</span><span><i style="background:#cc8f3e"></i>Flávio Bolsonaro</span><span>1 dot = {{dot_votes}} votes</span></div>
  </div>
</div>
<script src="vendor/d3-custom.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script type="module">
  import { loadGeo, loadDots } from "./js/mapcore.js";
  const cv = document.getElementById("c");
  const [geo, d] = await Promise.all([loadGeo(), loadDots(2026, 2)]);
  const W = cv.clientWidth, H = W * geo.height / geo.width, dpr = 2;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = `${H}px`;
  const ctx = cv.getContext("2d");
  const k = (W * dpr) / geo.width;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.fillStyle = "#221f28"; ctx.fill(geo.outline); for (const f of geo.feats) ctx.fill(f.path);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 0.85;
  const fx = cv.width / 65535, fy = cv.height / 65535;
  let last = -1;
  for (let i = 0; i < d.n; i++) {
    if (d.c[i] !== last) { ctx.fillStyle = d.c[i] === 0 ? "#a68be6" : "#cc8f3e"; last = d.c[i]; }
    ctx.fillRect(d.x[i] * fx, d.y[i] * fy, 2, 2);
  }
  document.body.dataset.ready = "1";
</script>
</body>
</html>
